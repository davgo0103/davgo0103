name: Generate Profile Cards

on:
  schedule:
    - cron: "0 1 * * *" # 每天 UTC 01:00（台灣 09:00）更新
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/generate_cards.py
      - .github/workflows/cards.yml

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats and languages cards (包含私人 repo 與組織)
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 scripts/generate_cards.py ${{ github.repository_owner }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.stats.svg metrics.languages.svg
          git diff --cached --quiet || git commit -m "Update profile cards"
          git push
