<svg xmlns="http://www.w3.org/2000/svg" width="380" height="188" viewBox="0 0 380 188" role="img" aria-label="Most Used Languages">
<title>Most Used Languages</title>
<style>
  .title { font: 600 18px 'Segoe UI', Ubuntu, sans-serif; fill: #70a5fd; animation: fadeIn .8s ease-in-out forwards; }
  .label { font: 600 14px 'Segoe UI', Ubuntu, 'Microsoft JhengHei', sans-serif; fill: #38bdae; }
  .value { font: 700 14px 'Segoe UI', Ubuntu, sans-serif; fill: #38bdae; }
  .muted { font: 400 11px 'Segoe UI', Ubuntu, 'Microsoft JhengHei', sans-serif; fill: #a9b1d6; }
  .icon { fill: #bf91f3; }
  .row { opacity: 0; animation: fadeIn .4s ease-in-out forwards; }
  .grow { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow .9s ease-out forwards; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes grow { to { transform: scaleX(1); } }
</style>
<rect x="0.5" y="0.5" rx="4.5" width="379" height="187" fill="#1a1b27" stroke="#2b2d42"/>
<text x="25" y="35" class="title">Most Used Languages</text>
<mask id="bar"><rect x="25" y="52" width="330" height="8" rx="4" fill="#fff"/></mask>
<g mask="url(#bar)" class="grow">
<rect x="25.00" y="52" width="127.43" height="8" fill="#3572A5"/>
<rect x="151.93" y="52" width="44.01" height="8" fill="#4F5D95"/>
<rect x="195.44" y="52" width="41.37" height="8" fill="#b07219"/>
<rect x="236.31" y="52" width="34.72" height="8" fill="#e34c26"/>
<rect x="270.53" y="52" width="29.46" height="8" fill="#f1e05a"/>
<rect x="299.49" y="52" width="20.79" height="8" fill="#c6538c"/>
<rect x="319.78" y="52" width="20.35" height="8" fill="#41b883"/>
<rect x="339.63" y="52" width="15.87" height="8" fill="#663399"/>
</g>
<g class="row" style="animation-delay:300ms" transform="translate(25,88)"><circle cx="5" cy="-5" r="5" fill="#3572A5"/><text x="16" class="label" style="fill:#a9b1d6">Python <tspan class="value" style="font-weight:400">38.5%</tspan></text></g>
<g class="row" style="animation-delay:400ms" transform="translate(200,88)"><circle cx="5" cy="-5" r="5" fill="#4F5D95"/><text x="16" class="label" style="fill:#a9b1d6">PHP <tspan class="value" style="font-weight:400">13.2%</tspan></text></g>
<g class="row" style="animation-delay:500ms" transform="translate(25,112)"><circle cx="5" cy="-5" r="5" fill="#b07219"/><text x="16" class="label" style="fill:#a9b1d6">Java <tspan class="value" style="font-weight:400">12.4%</tspan></text></g>
<g class="row" style="animation-delay:600ms" transform="translate(200,112)"><circle cx="5" cy="-5" r="5" fill="#e34c26"/><text x="16" class="label" style="fill:#a9b1d6">HTML <tspan class="value" style="font-weight:400">10.4%</tspan></text></g>
<g class="row" style="animation-delay:700ms" transform="translate(25,136)"><circle cx="5" cy="-5" r="5" fill="#f1e05a"/><text x="16" class="label" style="fill:#a9b1d6">JavaScript <tspan class="value" style="font-weight:400">8.8%</tspan></text></g>
<g class="row" style="animation-delay:800ms" transform="translate(200,136)"><circle cx="5" cy="-5" r="5" fill="#c6538c"/><text x="16" class="label" style="fill:#a9b1d6">SCSS <tspan class="value" style="font-weight:400">6.1%</tspan></text></g>
<g class="row" style="animation-delay:900ms" transform="translate(25,160)"><circle cx="5" cy="-5" r="5" fill="#41b883"/><text x="16" class="label" style="fill:#a9b1d6">Vue <tspan class="value" style="font-weight:400">6.0%</tspan></text></g>
<g class="row" style="animation-delay:1000ms" transform="translate(200,160)"><circle cx="5" cy="-5" r="5" fill="#663399"/><text x="16" class="label" style="fill:#a9b1d6">CSS <tspan class="value" style="font-weight:400">4.7%</tspan></text></g>
</svg>
